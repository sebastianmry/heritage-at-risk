# Daily data refresh: re-pulls only the time-critical, lightweight sources (AA travel advisory +
# UCDP, plus the small UNESCO inventory, because the runner is ephemeral and
# process.py needs it), recomputes the score and exports and commits only the
# derived artefacts. UCDP GED is CC BY 4.0 and token-free, the job needs no
# secrets. Heavy sources (OSM PBFs, Pleiades, natural hazard) stay static and
# are rebuilt manually.
#
# Notes: the monthly UCDP candidate hangs off a versioned URL
# (config.UCDP_CANDIDATE_CSV_URL, e.g. GEDEvent_v26_0_5.csv) and needs bumping
# on a new release. export.py stamps the run date into the metadata, so the
# job produces a commit every day (which also documents data freshness).
name: Daily data update

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # runner.temp is not yet available in the job env, so it is set below
      # as a step via the standard RUNNER_TEMP variable.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set DATA_DIR
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/heritage_data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/heritage_data"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Ingest time-critical sources
        run: |
          python ingest_unesco.py --refresh
          python ingest_aa.py --refresh
          python ingest_ucdp.py --refresh

      - name: Compute score and export artefacts
        run: |
          python process.py --recompute
          python export.py
          python export_events.py
          python export_radius.py

      - name: Mirror artefacts into the app assets
        run: |
          cp artifacts/sites.geojson app/assets/data/sites.geojson
          cp artifacts/conflict_events.geojson app/assets/data/conflict_events.geojson
          cp artifacts/conflict_radius.geojson app/assets/data/conflict_radius.geojson

      - name: Commit changed artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/sites.geojson artifacts/conflict_events.geojson \
                  artifacts/conflict_radius.geojson app/assets/data/
          if git diff --cached --quiet; then
            echo "No data change, no commit."
          else
            git commit -m "Data update: AA + UCDP refresh ($(date -u +%F))"
            git push
          fi
